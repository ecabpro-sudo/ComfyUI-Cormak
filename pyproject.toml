[project]
name = "cormak-nodes"
description = "Text to 3D and Image to 3D in ComfyUI. Create textured GLB assets with your Cormak account, preview them and use them in 3D workflows."
version = "0.1.0"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Homepage = "https://cormak.app"
Repository = "https://github.com/ecabpro-sudo/ComfyUI-Cormak"

[tool.comfy]
# Set this to the owner's verified publisher ID before publishing.
PublisherId = ""
DisplayName = "Cormak Nodes"
requires-comfyui = ">=0.45.0,<0.46.0"
Icon = "https://cormak.app/logo-mark.svg"
